<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALUM 周邊商品</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#f4f1e9;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  padding:28px;
}

.wrapper{
  max-width:1100px;
  margin:0 auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:28px;
}

.header h1{
  font-size:42px;
  letter-spacing:-1px;
}

.header p{
  color:#777;
  margin-top:8px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.product-card{
  background:#ebe9df;
  border-radius:22px;
  padding:22px;
  min-height:360px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
  transition:.25s ease;
}

.product-card:hover{
  transform:translateY(-5px);
  box-shadow:0 18px 36px rgba(0,0,0,.1);
}

.product-image{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
}

.product-image img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.product-category{
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.product-name{
  font-size:24px;
  font-weight:800;
  margin-bottom:8px;
}

.product-price{
  color:#506c9a;
  font-weight:800;
  font-size:16px;
}

.colors{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.color-dot{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 0 0 1px rgba(0,0,0,.2);
}

.black{ background:#111; }
.white{ background:#f7f7f7; }
.red{ background:#9b1c1c; }

.footer{
  text-align:center;
  margin-top:30px;
  color:#777;
  font-size:14px;
}

@media(max-width:900px){
  .product-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  body{
    padding:16px;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }

  .header h1{
    font-size:34px;
  }

  .product-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <header class="header">
    <div>
      <h1>MALUM 周邊商品</h1>
      <p>Graduation Showcase Merchandise</p>
    </div>
  </header>

  <section class="product-grid">

    <article class="product-card">
      <div>
        <div class="product-image">
          <img src="images/clothes-black.jpg" alt="黑色衣服">
        </div>
        <div class="product-category">Clothes</div>
        <div class="product-name">黑色衣服</div>
        <div class="product-price">NT$ 000</div>

        <div class="colors">
          <span class="color-dot black"></span>
        </div>
      </div>
    </article>

    <article class="product-card">
      <div>
        <div class="product-image">
          <img src="images/clothes-white.jpg" alt="白色衣服">
        </div>
        <div class="product-category">Clothes</div>
        <div class="product-name">白色衣服</div>
        <div class="product-price">NT$ 000</div>

        <div class="colors">
          <span class="color-dot white"></span>
        </div>
      </div>
    </article>

    <article class="product-card">
      <div>
        <div class="product-image">
          <img src="images/clothes-red.jpg" alt="紅色衣服">
        </div>
        <div class="product-category">Clothes</div>
        <div class="product-name">紅色衣服</div>
        <div class="product-price">NT$ 000</div>

        <div class="colors">
          <span class="color-dot red"></span>
        </div>
      </div>
    </article>

    <article class="product-card">
      <div>
        <div class="product-image">
          <img src="images/sticker.jpg" alt="貼紙">
        </div>
        <div class="product-category">Sticker</div>
        <div class="product-name">貼紙</div>
        <div class="product-price">NT$ 000</div>
      </div>
    </article>

    <article class="product-card">
      <div>
        <div class="product-image">
          <img src="images/keychain.jpg" alt="吊飾">
        </div>
        <div class="product-category">Keychain</div>
        <div class="product-name">吊飾</div>
        <div class="product-price">NT$ 000</div>
      </div>
    </article>

    <article class="product-card">
      <div>
        <div class="product-image">
          <img src="images/lightbox.jpg" alt="LED燈箱">
        </div>
        <div class="product-category">LED Light Box</div>
        <div class="product-name">LED 燈箱</div>
        <div class="product-price">NT$ 000</div>
      </div>
    </article>

  </section>

  <div class="footer">
    © MALUM Merchandise
  </div>

</div>

</body>
</html>
