<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALUM 周邊商品</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#f4f1e9;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  padding:28px;
  color:#222;
}

.wrapper{
  max-width:1100px;
  margin:0 auto;
}

.title{
  margin-bottom:30px;
}

.title h1{
  font-size:44px;
  margin-bottom:8px;
}

.title p{
  color:#777;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.product-card{
  background:#ebe9df;
  border-radius:24px;
  overflow:hidden;
  padding:22px;
  box-shadow:0 12px 28px rgba(0,0,0,.06);
}

.slider{
  position:relative;
  overflow:hidden;
  border-radius:18px;
}

.slides{
  display:flex;
  transition:transform .4s ease;
}

.slide{
  min-width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  height:260px;
}

.slide img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.slider-buttons{
  position:absolute;
  width:100%;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  justify-content:space-between;
  padding:0 10px;
}

.slider-buttons button{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  cursor:pointer;
  font-size:18px;
  font-weight:bold;
}

.product-category{
  margin-top:18px;
  font-size:13px;
  color:#777;
}

.product-name{
  font-size:26px;
  font-weight:800;
  margin-top:6px;
}

.product-price{
  margin-top:8px;
  font-size:17px;
  color:#4f6b99;
  font-weight:800;
}

.color-name{
  margin-top:10px;
  font-size:15px;
  font-weight:700;
}

.colors{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.color-dot{
  width:20px;
  height:20px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 0 0 1px rgba(0,0,0,.2);
}

.black{
  background:#111;
}

.white{
  background:#f7f7f7;
}

.red{
  background:#8b1d1d;
}

.footer{
  text-align:center;
  margin-top:30px;
  color:#777;
}

@media(max-width:900px){
  .product-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="title">
    <h1>MALUM 周邊商品</h1>
    <p>Graduation Showcase Merchandise</p>
  </div>

  <section class="product-grid">

    <!-- 衣服 -->
    <article class="product-card">

      <div class="slider">

        <div class="slides" id="slides">

          <div class="slide">
            <img src="images/clothes-black.jpg" alt="">
          </div>

          <div class="slide">
            <img src="images/clothes-white.jpg" alt="">
          </div>

          <div class="slide">
            <img src="images/clothes-red.jpg" alt="">
          </div>

        </div>

        <div class="slider-buttons">
          <button onclick="prevSlide()">‹</button>
          <button onclick="nextSlide()">›</button>
        </div>

      </div>

      <div class="product-category">Clothes</div>

      <div class="product-name">MALUM T-Shirt</div>

      <div class="product-price">NT$ 650</div>

      <div class="color-name" id="colorName">
        Black
      </div>

      <div class="colors">
        <span class="color-dot black"></span>
        <span class="color-dot white"></span>
        <span class="color-dot red"></span>
      </div>

    </article>

    <!-- 貼紙 -->
    <article class="product-card">

      <div class="slide" style="height:260px;">
        <img src="https://raw.githubusercontent.com/isufilmtv12nd-web/merchmalum/9649a2f954102b64880aecd129309a55f524eea2/%E8%B2%BC%E7%B4%99.webp" alt="">
      </div>

      <div class="product-category">Sticker</div>

      <div class="product-name">貼紙</div>

      <div class="product-price">NT$ 80</div>

    </article>

    <!-- 吊飾 -->
    <article class="product-card">

      <div class="slide" style="height:260px;">
        <img src="https://raw.githubusercontent.com/isufilmtv12nd-web/merchmalum/3a67acb6a6f45905690e43bfe0a9eaeda688b9d1/%E5%90%8A%E9%A3%BE.webp" alt="">
      </div>

      <div class="product-category">Keychain</div>

      <div class="product-name">吊飾</div>

      <div class="product-price">NT$ 150</div>

    </article>

    <!-- LED燈箱 -->
    <article class="product-card">

      <div class="slide" style="height:260px;">
        <img src="https://raw.githubusercontent.com/isufilmtv12nd-web/merchmalum/db9059803f78a5e416576acddb29e354f99c3167/LED%E7%87%88%E7%AE%B1.webp" alt="">
      </div>

      <div class="product-category">LED Light Box</div>

      <div class="product-name">LED燈箱</div>

      <div class="product-price">NT$ 1200</div>

    </article>

  </section>

  <div class="footer">
    © MALUM Merchandise
  </div>

</div>

<script>
const slides = document.getElementById('slides');
const colorName = document.getElementById('colorName');

const colors = [
  "Black",
  "White",
  "Red"
];

let currentIndex = 0;

function updateSlide(){
  slides.style.transform =
    `translateX(-${currentIndex * 100}%)`;

  colorName.textContent = colors[currentIndex];
}

function nextSlide(){
  currentIndex++;

  if(currentIndex > 2){
    currentIndex = 0;
  }

  updateSlide();
}

function prevSlide(){
  currentIndex--;

  if(currentIndex < 0){
    currentIndex = 2;
  }

  updateSlide();
}
</script>

</body>
</html>
